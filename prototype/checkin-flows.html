<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>情绪记账 · 交互原型</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1a1814;
      --bg-elevated: #242019;
      --surface: #2c271f;
      --ink: #f3ebe0;
      --ink-muted: #a89a88;
      --accent: #c4a574;
      --accent-soft: rgba(196, 165, 116, 0.16);
      --user: #3d4a3a;
      --ai: #2c271f;
      --line: rgba(243, 235, 224, 0.08);
      --danger: #c47a6a;
      --ok: #7a9e7e;
      --phone-w: 390px;
      --phone-h: 780px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Noto Sans SC", "DM Sans", sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, #2a241c 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 100%, #1e2a22 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 48px;
      gap: 20px;
    }

    .page-head {
      width: min(920px, 100%);
      display: grid;
      gap: 8px;
    }
    .page-head h1 {
      font-family: "DM Sans", "Noto Sans SC", sans-serif;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .page-head p {
      color: var(--ink-muted);
      font-size: 0.92rem;
      line-height: 1.55;
      max-width: 52ch;
    }

    .layout {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: start;
    }
    @media (min-width: 860px) {
      .layout { grid-template-columns: 280px 1fr; }
    }

    .flow-picker {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .flow-picker h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .flow-btn {
      text-align: left;
      border: 1px solid var(--line);
      background: var(--bg-elevated);
      color: var(--ink);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .flow-btn:hover { border-color: rgba(196, 165, 116, 0.35); }
    .flow-btn.active {
      background: var(--accent-soft);
      border-color: rgba(196, 165, 116, 0.55);
    }
    .flow-btn .title {
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    .flow-btn .desc {
      display: block;
      font-size: 0.78rem;
      color: var(--ink-muted);
      line-height: 1.4;
    }
    .flow-btn .tag {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.68rem;
      color: var(--accent);
      border: 1px solid rgba(196, 165, 116, 0.35);
      border-radius: 4px;
      padding: 2px 6px;
    }
    .flow-btn.contrast .tag { color: var(--danger); border-color: rgba(196, 122, 106, 0.4); }

    .phone-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .phone {
      width: min(var(--phone-w), 100%);
      height: var(--phone-h);
      max-height: 80vh;
      background: #0f0e0c;
      border-radius: 36px;
      border: 1px solid rgba(243, 235, 224, 0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .notch {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .notch::after {
      content: "";
      width: 96px;
      height: 10px;
      background: #000;
      border-radius: 999px;
    }

    .app-bar {
      padding: 4px 16px 12px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 8px;
      align-items: start;
    }
    .app-bar .brand {
      font-family: "DM Sans", sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2px;
      grid-column: 1;
    }
    .app-bar h3 {
      font-size: 1.05rem;
      font-weight: 600;
      grid-column: 1;
    }
    .app-bar .sub {
      font-size: 0.75rem;
      color: var(--ink-muted);
      margin-top: 2px;
      grid-column: 1;
    }
    .settings-btn {
      grid-column: 2;
      grid-row: 1 / span 3;
      align-self: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg-elevated);
      color: var(--ink-muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }
    .settings-btn:hover { color: var(--accent); border-color: rgba(196, 165, 116, 0.4); }

    .sheet {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      background: rgba(0, 0, 0, 0.55);
    }
    .sheet.open { display: flex; }
    .sheet-panel {
      background: #1c1915;
      border-top: 1px solid var(--line);
      border-radius: 20px 20px 0 0;
      padding: 18px 16px 28px;
      animation: rise 0.25s ease;
    }
    .sheet-panel h4 {
      font-size: 1rem;
      margin-bottom: 4px;
    }
    .sheet-panel .sheet-desc {
      font-size: 0.8rem;
      color: var(--ink-muted);
      line-height: 1.45;
      margin-bottom: 14px;
    }
    .sheet-panel label {
      display: block;
      font-size: 0.75rem;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }
    .sheet-panel input {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--bg-elevated);
      color: var(--ink);
      border-radius: 12px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    .sheet-panel input:focus { outline: 1px solid rgba(196, 165, 116, 0.45); }
    .name-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .name-presets button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink-muted);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: inherit;
    }
    .name-presets button:hover,
    .name-presets button.active {
      color: var(--accent);
      border-color: rgba(196, 165, 116, 0.45);
      background: var(--accent-soft);
    }
    .sheet-actions {
      display: flex;
      gap: 8px;
    }
    .sheet-actions button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
    }
    .preview-line {
      font-size: 0.82rem;
      color: var(--ink-muted);
      margin-bottom: 14px;
      line-height: 1.45;
      padding: 10px 12px;
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--line);
    }
    .preview-line em {
      font-style: normal;
      color: var(--accent);
      font-weight: 600;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background:
        linear-gradient(180deg, #141210 0%, #181612 100%);
    }

    .bubble {
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      animation: rise 0.28s ease;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .bubble.ai {
      align-self: flex-start;
      background: var(--ai);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--user);
      border-bottom-right-radius: 4px;
    }
    .bubble .meta {
      display: block;
      font-size: 0.68rem;
      color: var(--ink-muted);
      margin-bottom: 4px;
    }
    .bubble.system {
      align-self: center;
      max-width: 94%;
      background: transparent;
      border: 1px dashed rgba(196, 165, 116, 0.35);
      color: var(--ink-muted);
      font-size: 0.78rem;
      text-align: center;
      border-radius: 10px;
    }

    .soft-ask {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      border: 1px solid rgba(196, 165, 116, 0.4);
      background: var(--accent-soft);
      color: var(--ink);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .chip:hover { background: rgba(196, 165, 116, 0.28); }
    .chip.ghost {
      background: transparent;
      border-color: var(--line);
      color: var(--ink-muted);
    }

    .confirm-card {
      align-self: stretch;
      background: var(--surface);
      border: 1px solid rgba(196, 122, 106, 0.35);
      border-radius: 14px;
      padding: 12px;
      animation: rise 0.28s ease;
    }
    .confirm-card h4 {
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: var(--danger);
    }
    .confirm-card ul {
      list-style: none;
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }
    .confirm-card li {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 6px 8px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
    }
    .confirm-actions {
      display: flex;
      gap: 8px;
    }
    .confirm-actions button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary { background: var(--accent); color: #1a1814; font-weight: 600; }
    .btn-ghost { background: transparent; color: var(--ink-muted); border: 1px solid var(--line) !important; }

    .claim-list {
      align-self: stretch;
      display: grid;
      gap: 8px;
    }
    .claim-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }
    .claim-item .when {
      font-size: 0.72rem;
      color: var(--ink-muted);
      margin-bottom: 4px;
    }
    .claim-item .guess {
      font-size: 0.88rem;
      margin-bottom: 10px;
      line-height: 1.45;
    }
    .claim-item .actions {
      display: flex;
      gap: 8px;
    }
    .claim-item button {
      flex: 1;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      padding: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
    }
    .claim-item button.yes {
      background: rgba(122, 158, 126, 0.2);
      border-color: rgba(122, 158, 126, 0.45);
      color: #b8d4ba;
    }

    .composer {
      flex-shrink: 0;
      border-top: 1px solid var(--line);
      padding: 10px 12px 14px;
      background: #12110f;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .composer textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--line);
      background: var(--bg-elevated);
      color: var(--ink);
      border-radius: 14px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.9rem;
      min-height: 44px;
      max-height: 96px;
      line-height: 1.4;
    }
    .composer textarea:focus { outline: 1px solid rgba(196, 165, 116, 0.45); }
    .composer button.send {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #1a1814;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .quick-replies {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 0 12px 8px;
      background: #12110f;
      flex-shrink: 0;
    }
    .quick-replies button {
      white-space: nowrap;
      border: 1px solid var(--line);
      background: var(--bg-elevated);
      color: var(--ink-muted);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: inherit;
    }

    .status-strip {
      width: min(var(--phone-w), 100%);
      font-size: 0.8rem;
      color: var(--ink-muted);
      line-height: 1.45;
      padding: 10px 12px;
      background: var(--bg-elevated);
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .status-strip strong { color: var(--accent); font-weight: 600; }

    .hint {
      font-size: 0.82rem;
      color: var(--ink-muted);
      text-align: center;
      max-width: 36ch;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <header class="page-head">
    <h1>情绪记账 · 交互手感原型</h1>
    <p>
      点左侧切换四种「聊天如何变成记录」的做法，在右侧手机里点几轮。
      这不是真 AI，是脚本演示——重点感受：会不会像填表、会不会打断倾诉。
    </p>
  </header>

  <div class="layout">
    <aside class="flow-picker">
      <h2>选择手感</h2>
      <button class="flow-btn" data-flow="vent" type="button">
        <span class="title">A · 纯倾诉</span>
        <span class="desc">只聊天，不记账、不弹确认。情绪差时的主路径。</span>
        <span class="tag">零结构</span>
      </button>
      <button class="flow-btn active" data-flow="soft" type="button">
        <span class="title">B · 对话里软问一句</span>
        <span class="desc">聊着聊着 AI 自然问「焦虑是不是偏高？」可点可忽略。</span>
        <span class="tag">推荐体验 · 方案 5</span>
      </button>
      <button class="flow-btn" data-flow="cmd" type="button">
        <span class="title">C · 口令「记一下」</span>
        <span class="desc">平时陪聊；你主动说「记一下」才开始按维度问。</span>
        <span class="tag">推荐体验 · 方案 10</span>
      </button>
      <button class="flow-btn" data-flow="weekend" type="button">
        <span class="title">D · 周末批量认领</span>
        <span class="desc">平日只倾诉；周末左右滑：算进趋势 / 不算。</span>
        <span class="tag">复盘补账 · 方案 8</span>
      </button>
      <button class="flow-btn contrast" data-flow="form" type="button">
        <span class="title">E · 硬确认卡（对比）</span>
        <span class="desc">聊完弹出填表感确认卡——你刚才说不想要的那种。</span>
        <span class="tag">反例 · 感受差异</span>
      </button>
    </aside>

    <div class="phone-wrap">
      <div class="phone" id="phone">
        <div class="notch"></div>
        <div class="app-bar">
          <div class="brand">Emolog</div>
          <h3 id="screenTitle">今天</h3>
          <div class="sub" id="screenSub">纯倾诉 · 不会写入趋势</div>
          <button class="settings-btn" id="openSettings" type="button" title="称呼设置" aria-label="称呼设置">⚙</button>
        </div>
        <div class="chat" id="chat"></div>
        <div class="quick-replies" id="quick"></div>
        <div class="composer">
          <textarea id="input" rows="1" placeholder="说说今天…"></textarea>
          <button class="send" id="send" type="button">↑</button>
        </div>
        <div class="sheet" id="settingsSheet" aria-hidden="true">
          <div class="sheet-panel">
            <h4>AI 怎么喊你</h4>
            <p class="sheet-desc">只影响对话里的称呼，存在本机。可随时改。</p>
            <label for="nameInput">称呼</label>
            <input id="nameInput" type="text" maxlength="12" placeholder="例如：小海、阿白、今晚别叫我…" autocomplete="off" />
            <div class="name-presets" id="namePresets">
              <button type="button" data-name="你">不特地喊（用「你」）</button>
              <button type="button" data-name="朋友">朋友</button>
              <button type="button" data-name="今晚">今晚</button>
            </div>
            <div class="preview-line" id="namePreview">预览：晚上好，<em>你</em>。今天有哪一块比较占地方吗？</div>
            <div class="sheet-actions">
              <button type="button" class="btn-ghost" id="closeSettings">取消</button>
              <button type="button" class="btn-primary" id="saveSettings">保存并刷新对话</button>
            </div>
          </div>
        </div>
      </div>
      <div class="status-strip" id="status">
        账本状态：<strong>本会话未写入任何维度</strong>
      </div>
      <p class="hint" id="hint">先随便发两句，或点下方快捷回复。</p>
    </div>
  </div>

  <script>
    const NAME_KEY = "emolog.prototype.callName";

    function getCallName() {
      const v = localStorage.getItem(NAME_KEY);
      return v === null ? "你" : v;
    }

    function setCallName(name) {
      const cleaned = String(name || "").trim().slice(0, 12) || "你";
      localStorage.setItem(NAME_KEY, cleaned);
      return cleaned;
    }

    /** 把称呼嵌进句子：叫「你」时更自然，叫名字时加逗号停顿 */
    function address(name, withYouFallback) {
      const n = name || getCallName();
      if (n === "你") return withYouFallback || "你";
      return n;
    }

    function greetLine(name) {
      const n = address(name);
      if (n === "你") return "晚上好。今天身体和心情，有哪一块比较占地方吗？";
      return "晚上好，" + n + "。今天身体和心情，有哪一块比较占地方吗？";
    }

    function ventBoot(name) {
      const n = address(name);
      if (n === "你") return "我在。今天想先倒点什么都可以，不用整理成条目。";
      return "我在，" + n + "。今天想先倒点什么都可以，不用整理成条目。";
    }

    function cmdBoot(name) {
      const n = address(name);
      if (n === "你") return "我在听。想聊就聊；如果今天想留一笔账，直接说「记一下」。";
      return n + "，我在听。想聊就聊；如果今天想留一笔账，直接说「记一下」。";
    }

    function formBoot(name) {
      const n = address(name);
      if (n === "你") return "跟我说说今天吧，结束后我会请你确认各项分数。";
      return n + "，跟我说说今天吧，结束后我会请你确认各项分数。";
    }

    function softAskText(name) {
      const n = address(name);
      if (n === "你") {
        return "听起来今天紧绷感挺明显的。要不要把「焦虑」记成偏高？不想理这句也完全没问题。";
      }
      return n + "，听起来今天紧绷感挺明显的。要不要把「焦虑」记成偏高？不想理这句也完全没问题。";
    }

    function updateNamePreview() {
      const draft = document.getElementById("nameInput").value.trim() || "你";
      const n = address(draft);
      document.getElementById("namePreview").innerHTML =
        n === "你"
          ? "预览：晚上好。<em>你</em>不用被特地点名；AI 会用更中性的「你」。"
          : "预览：晚上好，<em>" + escapeHtml(n) + "</em>。今天有哪一块比较占地方吗？";
    }

    const flows = {
      vent: {
        title: "今天",
        sub: "纯倾诉 · 不会写入趋势",
        hint: "怎么发泄都可以。结束后也不会要你确认分数。右上角可改 AI 怎么喊你。",
        status: "账本状态：<strong>本会话未写入任何维度</strong>（设计如此）",
        boot: () => [{ role: "ai", text: ventBoot() }],
        quick: ["今天好烦，说不清", "跟家里人闹了点别扭", "先不想说话，陪我待着"]
      },
      soft: {
        title: "今天",
        sub: "软问 · 可忽略，不像填表",
        hint: "发两句后 AI 会软问一句。点右上角 ⚙ 改称呼，保存后对话会用新名字。",
        status: "账本状态：<strong>尚未记录</strong> · 只有你回应软问才会入账",
        boot: () => [{ role: "ai", text: greetLine() }],
        quick: ["脑子一直紧绷", "咖啡喝多了更慌", "其实还行，就是闷"]
      },
      cmd: {
        title: "今天",
        sub: "默认陪聊 · 说「记一下」才入账",
        hint: "先当树洞聊；想认真记时，发「记一下」或点快捷按钮。",
        status: "账本状态：<strong>陪聊模式</strong> · 尚未触发记账",
        boot: () => [{ role: "ai", text: cmdBoot() }],
        quick: ["今天开会被怼了", "记一下", "算了先不记"]
      },
      weekend: {
        title: "本周认领",
        sub: "平日聊天的草稿 · 你来决定算不算",
        hint: "点「算进趋势」或「不算」。这是周末才出现的轻负担补账。",
        status: "账本状态：<strong>3 条待认领草稿</strong>",
        boot: () => [],
        quick: []
      },
      form: {
        title: "今天",
        sub: "硬确认卡 · 反例（你刚才排斥的）",
        hint: "发一句后会强制弹出确认表。对比一下和 B/C 的差异。",
        status: "账本状态：<strong>等待你提交确认卡</strong>",
        boot: () => [{ role: "ai", text: formBoot() }],
        quick: ["整个人提不起劲", "焦虑到睡不着"]
      }
    };

    let current = "soft";
    let softAsked = false;
    let cmdMode = false;
    let ledger = [];

    const chatEl = document.getElementById("chat");
    const quickEl = document.getElementById("quick");
    const statusEl = document.getElementById("status");
    const hintEl = document.getElementById("hint");
    const inputEl = document.getElementById("input");
    const titleEl = document.getElementById("screenTitle");
    const subEl = document.getElementById("screenSub");
    const sheetEl = document.getElementById("settingsSheet");
    const nameInput = document.getElementById("nameInput");

    function setStatus(html) { statusEl.innerHTML = html; }

    function addBubble(role, text, extraHtml) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      if (role === "ai") {
        div.innerHTML = '<span class="meta">AI</span>' + escapeHtml(text) + (extraHtml || "");
      } else if (role === "user") {
        div.innerHTML = '<span class="meta">你</span>' + escapeHtml(text);
      } else {
        div.textContent = text;
      }
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function clearChat() {
      chatEl.innerHTML = "";
      quickEl.innerHTML = "";
      softAsked = false;
      cmdMode = false;
      ledger = [];
    }

    function renderQuick(items) {
      quickEl.innerHTML = "";
      items.forEach((t) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = t;
        b.addEventListener("click", () => {
          inputEl.value = t;
          send();
        });
        quickEl.appendChild(b);
      });
    }

    function renderWeekend() {
      clearChat();
      titleEl.textContent = flows.weekend.title;
      subEl.textContent = flows.weekend.sub;
      hintEl.textContent = flows.weekend.hint;
      setStatus(flows.weekend.status);

      addBubble("system", "根据本周聊天，AI 猜了这些（未写入趋势）");

      const wrap = document.createElement("div");
      wrap.className = "claim-list";
      const items = [
        { when: "周一 · 晚间对话", guess: "焦虑偏高 · 对同事看法偏负面 · 咖啡因 3 杯" },
        { when: "周三 · 短聊", guess: "心情低落 · 睡眠不足 · 未提及亲友" },
        { when: "周五 · 倾诉", guess: "情绪缓和 · 仍有残留紧张 · 咖啡因未提及" }
      ];
      items.forEach((it, idx) => {
        const card = document.createElement("div");
        card.className = "claim-item";
        card.innerHTML =
          '<div class="when">' + escapeHtml(it.when) + "</div>" +
          '<div class="guess">' + escapeHtml(it.guess) + "</div>" +
          '<div class="actions">' +
          '<button type="button" class="yes" data-i="' + idx + '">算进趋势</button>' +
          '<button type="button" data-skip="' + idx + '">不算</button>' +
          "</div>";
        wrap.appendChild(card);
      });
      chatEl.appendChild(wrap);

      wrap.addEventListener("click", (e) => {
        const yes = e.target.closest("button.yes");
        const skip = e.target.closest("button[data-skip]");
        const card = e.target.closest(".claim-item");
        if (!card) return;
        if (yes) {
          card.style.opacity = "0.45";
          card.querySelector(".guess").textContent += "  ✓ 已入账";
          card.querySelector(".actions").remove();
          ledger.push("认领");
          setStatus("账本状态：<strong>已认领 " + ledger.length + " 条</strong> · 其余仍可跳过");
        } else if (skip) {
          card.remove();
          setStatus("账本状态：<strong>已跳过一条草稿</strong> · 不会进趋势");
        }
      });
    }

    function showHardConfirm() {
      const card = document.createElement("div");
      card.className = "confirm-card";
      card.innerHTML =
        "<h4>请确认今日记录后保存</h4>" +
        "<ul>" +
        "<li><span>心情</span><span>3 / 10</span></li>" +
        "<li><span>焦虑</span><span>8 / 10</span></li>" +
        "<li><span>抑郁倾向</span><span>6 / 10</span></li>" +
        "<li><span>咖啡因</span><span>2 杯</span></li>" +
        "<li><span>对亲友看法</span><span>偏负面</span></li>" +
        "</ul>" +
        '<div class="confirm-actions">' +
        '<button type="button" class="btn-ghost" id="cCancel">以后再说</button>' +
        '<button type="button" class="btn-primary" id="cOk">确认保存</button>' +
        "</div>";
      chatEl.appendChild(card);
      chatEl.scrollTop = chatEl.scrollHeight;
      card.querySelector("#cCancel").onclick = () => {
        card.remove();
        addBubble("system", "已取消。你刚才那种「填表感」就是这里。");
        setStatus("账本状态：<strong>未保存</strong>（但已经被打断过一次）");
      };
      card.querySelector("#cOk").onclick = () => {
        card.remove();
        addBubble("system", "已保存。数据准了，但情绪差时这种打断很重。");
        setStatus("账本状态：<strong>已写入 5 个维度</strong>（硬确认）");
      };
    }

    function showSoftAsk() {
      const chips =
        '<div class="soft-ask">' +
        '<button type="button" class="chip" data-v="焦虑偏高">嗯，偏高</button>' +
        '<button type="button" class="chip" data-v="一般">一般般</button>' +
        '<button type="button" class="chip ghost" data-v="skip">先不谈这个</button>' +
        "</div>";
      const el = addBubble("ai", softAskText(), chips);
      el.querySelectorAll(".chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          const v = btn.getAttribute("data-v");
          el.querySelector(".soft-ask")?.remove();
          if (v === "skip") {
            addBubble("user", "先不谈这个");
            addBubble("ai", "好，那我们就继续聊。什么都不用记。");
            setStatus("账本状态：<strong>仍未写入</strong> · 软问被忽略，无压力");
          } else {
            addBubble("user", v === "焦虑偏高" ? "嗯，偏高" : "一般般");
            const n = address();
            addBubble(
              "ai",
              n === "你"
                ? "收到，只记了这一笔。其它维度今天先空着也行。"
                : "收到，" + n + "。只记了这一笔，其它维度今天先空着也行。"
            );
            setStatus("账本状态：<strong>焦虑 → " + v + "</strong>（对话内顺手记下，无表单页）");
          }
        });
      });
    }

    function startCmdLogging() {
      cmdMode = true;
      const n = address();
      addBubble(
        "ai",
        n === "你"
          ? "好，我们轻量记一笔。还是聊天，不是填表——今天焦虑大概什么感觉？用你的话说就行。"
          : "好，" + n + "，我们轻量记一笔。还是聊天，不是填表——今天焦虑大概什么感觉？"
      );
      setStatus("账本状态：<strong>记账中</strong> · 由你触发，不是系统逼问");
      renderQuick(["挺慌的", "还好，就是累", "取消记账"]);
    }

    function replyVent() {
      const n = address();
      const replies =
        n === "你"
          ? [
              "嗯，我听到了。不用急着总结成什么「状态」。",
              "这一块压着确实难受。你想继续往下说，还是就停在这里？",
              "我在。今天不必有结论。"
            ]
          : [
              "嗯，" + n + "，我听到了。不用急着总结成什么「状态」。",
              n + "，这一块压着确实难受。想继续往下说，还是就停在这里？",
              "我在，" + n + "。今天不必有结论。"
            ];
      addBubble("ai", replies[Math.floor(Math.random() * replies.length)]);
    }

    function replySoft() {
      const n = address();
      addBubble(
        "ai",
        n === "你" ? "谢谢你告诉我这些。先不用整理。" : "谢谢你告诉我这些，" + n + "。先不用整理。"
      );
      if (!softAsked) {
        softAsked = true;
        setTimeout(showSoftAsk, 450);
      }
    }

    function replyCmd(text) {
      if (/取消/.test(text)) {
        cmdMode = false;
        addBubble("ai", "好，回到陪聊。什么都不记。");
        setStatus("账本状态：<strong>已取消记账</strong> · 陪聊模式");
        renderQuick(flows.cmd.quick);
        return;
      }
      if (!cmdMode && /记一下|记一笔|帮我记/.test(text)) {
        startCmdLogging();
        return;
      }
      if (cmdMode) {
        addBubble("ai", "明白。我把「焦虑」先记成：你刚说的那种感觉。还想加咖啡因或心情吗？直接说；说「够了」就结束。");
        setStatus("账本状态：<strong>焦虑（口述）已记下</strong> · 仍无确认大卡");
        renderQuick(["咖啡喝了两杯", "心情大概四五分", "够了"]);
        if (/够了/.test(text)) {
          cmdMode = false;
          addBubble("ai", "好，今天就这些。想改以后再说。");
          setStatus("账本状态：<strong>今日已记若干维</strong> · 口令流程结束");
        }
        return;
      }
      addBubble("ai", "我在听。需要留档时说「记一下」就行。");
    }

    function replyForm() {
      addBubble("ai", "我大概理解了。请确认下面这张表，保存后才会进趋势——");
      setTimeout(showHardConfirm, 350);
    }

    function send() {
      const text = inputEl.value.trim();
      if (!text || current === "weekend") return;
      inputEl.value = "";
      addBubble("user", text);

      setTimeout(() => {
        if (current === "vent") replyVent(text);
        else if (current === "soft") replySoft(text);
        else if (current === "cmd") replyCmd(text);
        else if (current === "form") replyForm(text);
      }, 320);
    }

    function loadFlow(id) {
      current = id;
      document.querySelectorAll(".flow-btn").forEach((b) => {
        b.classList.toggle("active", b.getAttribute("data-flow") === id);
      });

      if (id === "weekend") {
        renderWeekend();
        return;
      }

      clearChat();
      const f = flows[id];
      titleEl.textContent = f.title;
      subEl.textContent = f.sub;
      hintEl.textContent = f.hint;
      setStatus(f.status);
      f.boot().forEach((m) => addBubble(m.role, m.text));
      renderQuick(f.quick);
    }

    function openSettings() {
      nameInput.value = getCallName() === "你" ? "" : getCallName();
      document.querySelectorAll("#namePresets button").forEach((b) => {
        const n = getCallName();
        b.classList.toggle("active", b.getAttribute("data-name") === n || (n === "你" && b.getAttribute("data-name") === "你"));
      });
      updateNamePreview();
      sheetEl.classList.add("open");
      sheetEl.setAttribute("aria-hidden", "false");
      nameInput.focus();
    }

    function closeSettings() {
      sheetEl.classList.remove("open");
      sheetEl.setAttribute("aria-hidden", "true");
    }

    document.querySelectorAll(".flow-btn").forEach((btn) => {
      btn.addEventListener("click", () => loadFlow(btn.getAttribute("data-flow")));
    });
    document.getElementById("send").addEventListener("click", send);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    document.getElementById("openSettings").addEventListener("click", openSettings);
    document.getElementById("closeSettings").addEventListener("click", closeSettings);
    sheetEl.addEventListener("click", (e) => {
      if (e.target === sheetEl) closeSettings();
    });
    nameInput.addEventListener("input", updateNamePreview);
    document.querySelectorAll("#namePresets button").forEach((b) => {
      b.addEventListener("click", () => {
        const n = b.getAttribute("data-name");
        nameInput.value = n === "你" ? "" : n;
        document.querySelectorAll("#namePresets button").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        updateNamePreview();
      });
    });
    document.getElementById("saveSettings").addEventListener("click", () => {
      const raw = nameInput.value.trim();
      setCallName(raw === "" ? "你" : raw);
      closeSettings();
      loadFlow(current === "weekend" ? "soft" : current);
    });

    loadFlow("soft");
  </script>
</body>
</html>
